name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js syntax check
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -e
          for f in $(git ls-files '*.js'); do node --check "$f"; done
          echo "node: ok"

      - name: Shell syntax check
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          echo "shell: ok"

      - name: Python syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -e
          for f in $(git ls-files 'image_gen/*.py'); do python3 -m py_compile "$f"; done
          echo "python: ok"